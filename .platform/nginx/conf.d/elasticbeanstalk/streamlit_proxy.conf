# ── ContextOS: Nginx reverse-proxy for Streamlit on Elastic Beanstalk ──
#
# Streamlit is launched with --server.baseUrlPath streamlit, so ALL of its
# requests (HTML, static assets, WebSocket) will be under /streamlit/
# We proxy the entire /streamlit/ tree straight through without stripping
# the prefix (proxy_pass ends with /streamlit/ so nothing is stripped).

location /streamlit/ {
    proxy_pass          http://127.0.0.1:8501/streamlit/;
    proxy_http_version  1.1;

    # WebSocket upgrade headers
    proxy_set_header    Upgrade    $http_upgrade;
    proxy_set_header    Connection "upgrade";

    # Standard proxy headers
    proxy_set_header    Host               $host;
    proxy_set_header    X-Real-IP          $remote_addr;
    proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto  $scheme;

    # Keep WebSocket connections alive
    proxy_read_timeout  86400;
    proxy_send_timeout  86400;
}
